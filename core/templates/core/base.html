<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartify</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #00aa6c; padding: 12px 30px; width: 100%;">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold fs-4" href="{% url 'home' %}">Kartify</a>
                
                <div class="ms-auto d-flex align-items-center gap-3">
                    {% if user.is_authenticated %}
                        <a href="{% url 'chat_home' %}" class="btn btn-sm btn-outline-light fw-semibold text-decoration-none">
                            <i class="fas fa-comments"></i> Chat
                        </a>
                        <a href="{% url 'my_ads' %}" class="btn btn-sm btn-light fw-bold text-dark text-decoration-none">
                            <i class="fas fa-user"></i> My Account
                        </a>
                        <form action="{% url 'logout' %}" method="post" style="display: inline; margin: 0;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-sm btn-danger fw-semibold">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="text-white text-decoration-none fw-semibold">Sign In</a>
                        <a href="{% url 'register' %}" class="text-white text-decoration-none fw-semibold">Register</a>
                    {% endif %}
                    <a href="{% url 'add_product' %}" class="btn btn-warning fw-bold text-dark px-3">+ Post Your Ad</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content Block -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
