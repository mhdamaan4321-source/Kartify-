{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Ad - Kartify</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 0; color: #333; }
        header { background: #002f34; color: white; padding: 12px 20px; }
        header a { color: #ffce00; text-decoration: none; font-weight: bold; font-size: 15px; }
        
        .container { max-width: 600px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { color: #002f34; margin-top: 0; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; font-size: 13px; }
        
        input[type="text"], input[type="number"], textarea, select, input[type="file"] {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; background: #fff;
        }
        textarea { resize: vertical; height: 90px; }
        
        .submit-btn { background: #20ab89; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; transition: 0.2s; }
        .submit-btn:hover { background: #198d71; }

        /* Desktop View Adjustments */
        @media (min-width: 768px) {
            header { padding: 15px 40px; }
            .container { max-width: 600px; margin: 30px auto; padding: 30px; }
            h2 { font-size: 24px; }
            .form-group { margin-bottom: 20px; }
            label { font-size: 14px; }
            input[type="text"], input[type="number"], textarea, select, input[type="file"] { padding: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="{% url 'home' %}">← Back to Home</a>
    </header>

    <div class="container">
        <h2>Post a New Product / Ad</h2>
        
        <!-- Form Tag with enctype -->
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Product Title</label>
                <input type="text" name="name" placeholder="e.g. iPhone 13 Pro, Honda Dio" required>
            </div>

            <!-- Category Dropdown -->
            <div class="form-group">
                <label>Category</label>
                <select name="category" id="id_category" required>
                    <option value="">Select Category</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Subcategory Dropdown (Dynamic) -->
            <div class="form-group">
                <label>Subcategory</label>
                <select name="subcategory" id="id_subcategory" required disabled>
                    <option value="">Select Category first</option>
                </select>
            </div>

            <div class="form-group">
                <label>Price (Rs.)</label>
                <input type="number" name="price" placeholder="e.g. 150000" required>
            </div>

            <div class="form-group">
                <label>Location (City)</label>
                <select name="city" required>
                    <option value="">Select City</option>
                    {% for city in cities %}
                        <option value="{{ city.id }}">{{ city.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Product Images (Multiple select pannalam)</label>
                <input type="file" name="images" accept="image/*" multiple required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" placeholder="Describe your item in detail..."></textarea>
            </div>

            <div class="form-group">
                <label>Phone Number (WhatsApp)</label>
                <input type="text" name="phone_number" placeholder="e.g. 94771234567" required>
            </div>

            <button type="submit" class="submit-btn">Post Ad</button>
        </form>
    </div>

   <!-- jQuery for Dynamic Subcategories -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $('#id_category').change(function () {
            var categoryId = $(this).val();
            var subcategorySelect = $('#id_subcategory');

            subcategorySelect.html('<option value="">Select Subcategory</option>');
            
            if (categoryId) {
                subcategorySelect.prop('disabled', false);
                
                $.ajax({
                    url: "{% url 'ajax_load_subcategories' %}",
                    data: {
                        'category_id': categoryId
                    },
                    success: function (data) {
                        $.each(data, function (key, subcategory) {
                            subcategorySelect.append('<option value="' + subcategory.id + '">' + subcategory.name + '</option>');
                        });
                    }
                });
            } else {
                subcategorySelect.prop('disabled', true);
            }
        });
    </script>
</body>
</html>
