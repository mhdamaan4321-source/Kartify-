{% extends 'core/base.html' %}
{% block content %}
<div class="container mt-3 mb-4" style="max-width: 800px;">
    <div class="d-flex align-items: center justify-content-between mb-2">
        <h3 style="color: #002f34; font-size: 20px;"><i class="fas fa-user-circle"></i> Chat with {{ receiver.username }}</h3>
        <a href="{% url 'chat_home' %}" class="btn btn-sm btn-outline-secondary"><i class="fas fa-arrow-left"></i> Back to Chats</a>
    </div>
    <hr class="mt-1">
    
    <!-- Messages Box -->
    <div id="chat-box" class="card p-3 mb-3 shadow-sm" style="height: 380px; overflow-y: scroll; background-color: #f8f9fa; border-radius: 8px;">
        {% for msg in messages_list %}
            <div class="mb-2 {% if msg.sender == request.user %}text-end{% else %}text-start{% endif %}">
                <div class="d-inline-block p-2 rounded shadow-sm {% if msg.sender == request.user %}bg-success text-white{% else %}bg-white text-dark border{% endif %}" style="max-width: 75%; word-break: break-word; text-align: left;">
                    {{ msg.message }}
                </div>
                <div style="font-size: 10px; color: #777; margin-top: 2px;">{{ msg.timestamp|date:"M d, H:i" }}</div>
            </div>
        {% empty %}
            <div class="text-center py-5 text-muted">
                <i class="fas fa-comments fa-2x mb-2"></i>
                <p class="mb-0">No messages yet. Send a message to start chatting!</p>
            </div>
        {% endfor %}
    </div>

    <!-- Send Message Form -->
    <form method="post">
        {% csrf_token %}
        <div class="input-group shadow-sm">
            <input type="text" name="message" class="form-control" placeholder="Type your message..." required autocomplete="off" style="padding: 12px;">
            <button class="btn btn-success px-4 fw-bold" type="submit"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
    </form>
</div>

<!-- Auto Scroll to Bottom of Chat -->
<script>
    const chatBox = document.getElementById('chat-box');
    chatBox.scrollTop = chatBox.scrollHeight;
</script>
{% endblock %}
