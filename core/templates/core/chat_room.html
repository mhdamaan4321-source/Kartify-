{% extends 'core/base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Chat with {{ receiver.username }}</h2>
    <hr>
    
    <!-- Messages Box -->
    <div class="card p-3 mb-3" style="height: 400px; overflow-y: scroll; background-color: #f8f9fa;">
        {% for msg in messages_list %}
            <div class="mb-2 {% if msg.sender == request.user %}text-end{% else %}text-start{% endif %}">
                <div class="d-inline-block p-2 rounded {% if msg.sender == request.user %}bg-success text-white{% else %}bg-secondary text-white{% endif %}" style="max-width: 70%; word-break: break-word;">
                    {{ msg.message }}
                </div>
                <div style="font-size: 10px; color: gray;">{{ msg.timestamp|date:"M d, H:i" }}</div>
            </div>
        {% empty %}
            <p class="text-center text-muted">No messages yet. Send a message to start chatting!</p>
        {% endfor %}
    </div>

    <!-- Send Message Form -->
    <form method="post">
        {% csrf_token %}
        <div class="input-group">
            <input type="text" name="message" class="form-control" placeholder="Type your message..." required autocomplete="off">
            <button class="btn btn-success" type="submit">Send</button>
        </div>
    </form>
</div>
{% endblock %}
